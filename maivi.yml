name: "maivi"
base: "luajit"

globals:
  # maivi =======================================================================
  maivi:
    any: true

  # h ===========================================================================
  h:
    any: true

  # this ========================================================================
  this.base_url:
    property: read-only
  this.rev:
    property: read-only
  this.data:
